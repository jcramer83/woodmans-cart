<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="Grocery illustration">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6efe4"/>
      <stop offset="1" stop-color="#f3d2c4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="360" fill="url(#sky)"/>
  <circle cx="680" cy="70" r="86" fill="#f6c445" opacity="0.85"/>
  <circle cx="640" cy="250" r="120" fill="#e7f6e4" opacity="0.9"/>
  <ellipse cx="250" cy="300" rx="180" ry="28" fill="#e7d3bf" opacity="0.7"/>
  <!-- milk -->
  <g transform="translate(470 78)">
    <rect x="18" y="28" width="86" height="150" rx="10" fill="#f7f7f7"/>
    <rect x="18" y="96" width="86" height="40" fill="#2f80c4"/>
    <rect x="36" y="12" width="50" height="22" rx="6" fill="#dce8f2"/>
  </g>
  <!-- bread -->
  <g transform="translate(560 150)">
    <rect x="10" y="40" width="150" height="78" rx="36" fill="#e6b070"/>
    <rect x="34" y="62" width="10" height="40" rx="4" fill="#c48448"/>
    <rect x="64" y="62" width="10" height="40" rx="4" fill="#c48448"/>
    <rect x="94" y="62" width="10" height="40" rx="4" fill="#c48448"/>
  </g>
  <!-- tomato -->
  <g transform="translate(150 90)">
    <ellipse cx="70" cy="78" rx="58" ry="50" fill="#e23d4a"/>
    <ellipse cx="50" cy="60" rx="16" ry="10" fill="#ff8a80" opacity="0.7"/>
    <path d="M70 28c-8-16-24-18-18-6-10-8-18-2-12 8" fill="#3e8f4a"/>
  </g>
  <!-- leaf -->
  <g transform="translate(40 150)">
    <ellipse cx="70" cy="70" rx="62" ry="46" fill="#3e8f4a"/>
    <ellipse cx="70" cy="64" rx="36" ry="26" fill="#7ec468"/>
    <ellipse cx="70" cy="58" rx="14" ry="16" fill="#e8f8d6"/>
  </g>
  <!-- berries -->
  <g transform="translate(250 200)">
    <circle cx="28" cy="36" r="22" fill="#c62828"/>
    <circle cx="62" cy="30" r="20" fill="#e23d4a"/>
    <circle cx="48" cy="58" r="18" fill="#ad1457"/>
    <path d="M40 16c8-14 22-12 18 2" fill="#2e7d46"/>
  </g>
</svg>
